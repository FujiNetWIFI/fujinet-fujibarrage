# barrage-a78.cfg -- FujiBarrage on the Atari 7800: a SuperGame image with
# the cart's RAM (the claim's kind 5, flags 1) for the FujiNet 7800
# cartridge (FujiBlast's layout). 128K in eight 16K banks; the window at
# $8000-$BFFF takes banks 0-6, bank 7 sits at $C000 for good.
#
#   banks 0-6   $8000-$A3FF  REPL: the same 9K in every one (linked into
#                            bank 0, copied to 1-6 by tools/atari7800/
#                            mkrom.py): the font (MARIA reads it whichever
#                            bank is in), then more of the core
#               $A400-$BFFF  the bank's own, reached through the wrappers
#                            tools/atari7800/far.txt lists: bank 0 the
#                            field (src/play.c), 1 the rooms and the
#                            catalog, 2 the menus, 3 the boot and the
#                            tests; 4 the sound's data (the frame's DLI
#                            puts it in while it plays); 5 the field
#                            screen's set-up
#   bank 7      $C000-$FF6F  the core, then the claim, the signature area
#                            and the vectors
#
# RAM: zero page $40-$FF; the console's $1800-$203F and $2200-$27FF the
# display lists (two 64-byte slots a row) and what the DLIs read (maria.s);
# the cart's 16K: $4000-$5FFF the field (a78.inc), $6000 up the variables,
# the C stack at the top.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0200;
}
MEMORY {
    ZP:     file = "", start = $0040, size = $00C0, type = rw, define = yes;
    CONS1:  file = "", start = $1800, size = $0840, type = rw, define = yes;
    CONS2:  file = "", start = $2100, size = $0040, type = rw, define = yes;
    CONS3:  file = "", start = $2200, size = $0600, type = rw, define = yes;
    CRAM:   file = "", start = $6000, size = $2000 - __STACKSIZE__, type = rw, define = yes;
    CSTACK: file = "", start = $8000 - __STACKSIZE__, size = __STACKSIZE__, type = rw, define = yes;
    R0:     file = %O, start = $8000, size = $2400, fill = yes, fillval = $FF, define = yes;
    B0:     file = %O, start = $A400, size = $1C00, fill = yes, fillval = $FF, define = yes;
    R1:     file = %O, start = $8000, size = $2400, fill = yes, fillval = $FF;
    B1:     file = %O, start = $A400, size = $1C00, fill = yes, fillval = $FF, define = yes;
    R2:     file = %O, start = $8000, size = $2400, fill = yes, fillval = $FF;
    B2:     file = %O, start = $A400, size = $1C00, fill = yes, fillval = $FF, define = yes;
    R3:     file = %O, start = $8000, size = $2400, fill = yes, fillval = $FF;
    B3:     file = %O, start = $A400, size = $1C00, fill = yes, fillval = $FF, define = yes;
    R4:     file = %O, start = $8000, size = $2400, fill = yes, fillval = $FF;
    B4:     file = %O, start = $A400, size = $1C00, fill = yes, fillval = $FF, define = yes;
    R5:     file = %O, start = $8000, size = $2400, fill = yes, fillval = $FF;
    B5:     file = %O, start = $A400, size = $1C00, fill = yes, fillval = $FF, define = yes;
    R6:     file = %O, start = $8000, size = $2400, fill = yes, fillval = $FF;
    B6:     file = %O, start = $A400, size = $1C00, fill = yes, fillval = $FF;
    FIXED:  file = %O, start = $C000, size = $3F70, fill = yes, fillval = $FF, define = yes;
    CLAIM:  file = %O, start = $FF70, size = $000A, fill = yes, fillval = $00;
    SIG:    file = %O, start = $FF7A, size = $007E, fill = yes, fillval = $FF;
    VECS:   file = %O, start = $FFF8, size = $0008;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,     type = zp;
    EXTZP:     load = ZP,     type = zp, optional = yes;
    DLSLOTS:   load = CONS1,  type = bss, define = yes;
    DLSLOTS2:  load = CONS3,  type = bss, define = yes;
    CONSBSS:   load = CONS3,  type = bss, define = yes;
    # REPL: the font first (page-aligned: CHARBASE $80), then the core's rest
    FONT:      load = R0,     type = ro, define = yes;
    REPLCODE:  load = R0,     type = ro, define = yes, optional = yes;
    REPLRO:    load = R0,     type = ro, define = yes, optional = yes;
    CASCODE:   load = R0,     type = ro, optional = yes;     # (src/atari/pt.s: the 800's cassette buffer)
    # the overlays
    FIELDCODE: load = B0,     type = ro, define = yes;
    FIELDRO:   load = B0,     type = ro, define = yes, optional = yes;
    ROOMCODE:  load = B1,     type = ro, define = yes;
    ROOMRO:    load = B1,     type = ro, define = yes, optional = yes;
    CATALOG:   load = B1,     type = ro, define = yes;
    MENUCODE:  load = B2,     type = ro, define = yes;
    MENURO:    load = B2,     type = ro, define = yes, optional = yes;
    BOOTCODE:  load = B3,     type = ro, define = yes, optional = yes;
    BOOTRO:    load = B3,     type = ro, define = yes, optional = yes;
    SNDDATA:   load = B4,     type = ro, define = yes;
    FOPEN:     load = B5,     type = ro, define = yes;
    FOPENRO:   load = B5,     type = ro, define = yes, optional = yes;
    # the core
    STARTUP:   load = FIXED,  type = ro, define = yes;
    LOWCODE:   load = FIXED,  type = ro, optional = yes;
    ONCE:      load = FIXED,  type = ro, optional = yes;
    CODE:      load = FIXED,  type = ro, define = yes;
    RODATA:    load = FIXED,  type = ro, define = yes;
    DATA:      load = FIXED,  run = CRAM, type = rw, define = yes;
    BSS:       load = CRAM,   type = bss, define = yes;
    HIGH:      load = CRAM,   type = bss, define = yes, optional = yes;
    BSS2:      load = CRAM,   type = bss, define = yes, optional = yes;
    PMGFREE:   load = CRAM,   type = bss, define = yes, optional = yes;
    LOWBSS:    load = CRAM,   type = bss, define = yes, optional = yes;
    MIDBSS:    load = CRAM,   type = bss, define = yes, optional = yes;
    CLAIM:     load = CLAIM,  type = ro;
    VECTORS:   load = VECS,   type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
