# barrage-nes.cfg -- FujiBarrage on the NES: an MMC3 image (mapper 4) for
# the FujiNet NES cartridge: 256K PRG in thirty-two 8K banks, 32K CHR-RAM,
# 8K WRAM (src/nes/crt0.s has the header).
#
#   bank 0      CODE2 at $A000 (R7, never switched): more of the program
#   banks 1-29  at $8000 (R6, prg_r6): the art (1), the overlays -- the
#               field (2: src/play.c), the rooms (3: room.c, cat.c, the
#               catalog), the menus (4: menus.c, appkey.c's saves), the
#               boot (5: appkey.c's load, test.c), the field screen's set-up
#               (7: fieldo.c), called through the far wrappers
#               (tools/nes/far.txt) -- and the music and pictures
#   banks 30-31 $C000-$FFFF, fixed: the program, the claim ("FUJI" at
#               $FFF0, which keeps the cartridge's mailbox alive) and the
#               vectors
#
# RAM: zero page; $0200 the sprites (OAM DMA), $0300 the PPU queue, $0400
# the sprites' second page; $0500-$061F the player's state (MIDBSS),
# $0620-$07FF the C stack. The cartridge's WRAM at $6000 holds the data and
# the variables (the shared code's BSS2, PMGFREE and LOWBSS are the Atari's
# names: here they are WRAM too).
MEMORY {
    ZP:     file = "", start = $0000, size = $0100, type = rw, define = yes;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    B0:     file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    B1:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B2:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B3:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B4:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B5:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B6:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B7:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B8:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B9:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B10:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B11:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B12:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B13:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B14:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B15:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B16:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B17:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B18:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B19:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B20:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B21:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B22:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B23:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B24:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B25:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B26:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B27:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B28:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B29:    file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    FIXED:  file = %O, start = $C000, size = $3FF0, fill = yes, fillval = $FF, define = yes;
    CLAIM:  file = %O, start = $FFF0, size = $000A, fill = yes, fillval = $FF;
    VECS:   file = %O, start = $FFFA, size = $0006, fill = yes;
    STKLO:  file = "", start = $0120, size = $0060;   # (the stack page's bottom: crt0's QBUF is $0100-$011F)
    OAMRAM: file = "", start = $0200, size = $0100;
    QRAM:   file = "", start = $0300, size = $0100;
    OAM2RAM: file = "", start = $0400, size = $0100;
    LORAM:  file = "", start = $0500, size = $0120;
    CSTACK: file = "", start = $0620, size = $01E0, define = yes;
    RAM:    file = "", start = $6000, size = $2000, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HEADER:   load = HEADER, type = ro;
    CODE2:    load = B0,     type = ro, define = yes, optional = yes;
    ART:      load = B1,     type = ro, define = yes, optional = yes;
    FIELDCODE: load = B2,    type = ro, define = yes, optional = yes;
    FIELDRO:  load = B2,     type = ro, optional = yes;
    ROOMCODE: load = B3,     type = ro, define = yes, optional = yes;
    ROOMRO:   load = B3,     type = ro, optional = yes;
    CATALOG:  load = B3,     type = ro, optional = yes;
    MENUCODE: load = B4,     type = ro, define = yes, optional = yes;
    MENURO:   load = B4,     type = ro, optional = yes;
    BOOTCODE: load = B5,     type = ro, define = yes, optional = yes;
    BOOTRO:   load = B5,     type = ro, optional = yes;
    FOPEN:    load = B7,     type = ro, define = yes, optional = yes;
    STARTUP:  load = FIXED,  type = ro, define = yes;
    LOWCODE:  load = FIXED,  type = ro, optional = yes;
    SPLIT:    load = FIXED,  type = ro, align = $100;
    ONCE:     load = FIXED,  type = ro, optional = yes;
    CODE:     load = FIXED,  type = ro, define = yes;
    RODATA:   load = FIXED,  type = ro, define = yes;
    DATA:     load = FIXED,  run = RAM, type = rw, define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
    BSS2:     load = RAM,    type = bss, optional = yes;
    PMGFREE:  load = RAM,    type = bss, optional = yes;
    LOWBSS:   load = RAM,    type = bss, optional = yes;
    MIDBSS:   load = LORAM,  type = bss, optional = yes;
    HIGH:     load = RAM,    type = bss, optional = yes;
    STKLO:    load = STKLO,  type = bss, optional = yes;
    OAM:      load = OAMRAM, type = bss;
    PPUQ:     load = QRAM,   type = bss;
    OAM2:     load = OAM2RAM, type = bss;
    CLAIM:    load = CLAIM,  type = ro;
    VECTORS:  load = VECS,   type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
