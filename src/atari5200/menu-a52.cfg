# menu-a52.cfg -- the 5200 menu (the title, the name, the rooms: -DMENU):
# bank 0 of the 128K Super Cart, a program of its own, entered at $4000 by
# the game's src/atari5200/bank.s (barrage-a52.cfg has the game's banks).
#
#   $4000-$AFFF  the program (STARTUP first: the entry)
#   $B000-$B7FF  the cartridge's mailbox ($FF here)
#   $B800-$BFBB  more of it
#   $BFBC-$BFDF  $FF (the bank switch's reads)
#   $BFE0-$BFFF  the claim and the header, as bank 3's (never seen: a read
#                there is bank 3)
#
# RAM as the game's: the text screen in the field's memory ($1010), PMBASE
# $0800; the variables below $0800 and from $2B00.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0080;
}
MEMORY {
    ZP:      file = "", start = $001D, size = $00E3, type = rw, define = yes;
    LOW:     file = "", start = $021C, size = $0800 - $021C, type = rw, define = yes;
    PMGFREE: file = "", start = $0800, size = $0300, type = rw;
    RAM:     file = "", start = $2B00, size = $4000 - $2B00 - __STACKSIZE__, type = rw, define = yes;
    STACK:   file = "", start = $4000 - __STACKSIZE__, size = __STACKSIZE__, type = rw, define = yes;

    ROM:  file = %O, start = $4000, size = $7000, fill = yes, fillval = $FF, define = yes;
    AR:   file = %O, start = $B000, size = $0800, fill = yes, fillval = $FF;
    ROM2: file = %O, start = $B800, size = $07BC, fill = yes, fillval = $FF, define = yes;
    GD:   file = %O, start = $BFBC, size = $0004, fill = yes, fillval = $FF;
    HS:   file = %O, start = $BFC0, size = $0020, fill = yes, fillval = $FF;
    CL:   file = %O, start = $BFE0, size = $0008, fill = yes, fillval = $00;
    HD:   file = %O, start = $BFE8, size = $0018;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    EXTZP:    load = ZP,   type = zp, optional = yes;
    STARTUP:  load = ROM,  type = ro, define = yes;
    LOWCODE:  load = ROM,  type = ro, optional = yes;
    ONCE:     load = ROM,  type = ro, optional = yes;
    CODE:     load = ROM,  type = ro, define = yes;
    RODATA:   load = ROM,  type = ro, define = yes;
    CATALOG:  load = ROM,  type = ro, optional = yes;
    BOOTCODE: load = ROM,  type = ro, optional = yes;
    DATA:     load = ROM2, run = RAM, type = rw, define = yes;
    BSS:      load = RAM,  type = bss, define = yes;
    HIGH:     load = RAM,  type = bss, optional = yes;
    MIDBSS:   load = RAM,  type = bss, optional = yes;
    LOWBSS:   load = LOW,  type = bss, optional = yes;
    BSS2:     load = LOW,  type = bss, optional = yes;
    INIT:     load = RAM,  type = bss, optional = yes;
    PMGFREE:  load = PMGFREE, type = bss, optional = yes;
    CLAIM:    load = CL,   type = ro;
    CARTHDR:  load = HD,   type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
