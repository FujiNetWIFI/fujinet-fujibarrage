# barrage-a52.cfg -- the 5200 game: banks 1-3 of a 128K Super Cart (the
# claim's kind 4; the menu is bank 0, menu-a52.cfg). A bank is the whole cart
# window, $4000-$BFFF; a read of $BFD0 + 4n picks bank n, and the console
# starts in bank 3. Every bank:
#
#   $4000-__REPL__-1  its own: an overlay (bank 3 the field: src/play.c;
#                     bank 2 the rooms and the catalog; bank 1 the boot
#                     code and the test scenes), called through
#                     tools/atari5200/far.txt
#   __REPL__-$AFFF    the core, the same in every bank (linked into bank 3,
#   $B800-$BFBB       copied to 1-2 by tools/atari5200/mkrom.py), so it runs
#                     whichever bank is in: everything the link, the VBI or
#                     both overlays reach
#   $B000-$B7FF       the cartridge's mailbox, over every bank ($FF here)
#   $BFBC-$BFDF       $FF (the bank switch's reads; an RTS's dummy read)
#   $BFE0-$BFFF       the claim ("FUJI") and the BIOS's header
#
# RAM, 16K (src/atari/hw.inc, atari.h):
#
#   $0000-$001C  the crt0's shadows and clock (the BIOS's places)
#   $001D-$00FF  zero page
#   $0200-$021B  the vectors
#   $021C-$07FF  LOW: low variables
#   $0800-$0AFF  PMGFREE: PMBASE's unused part (display lists, row tables)
#   $0B00-$0FFF  missiles, players 0-3 (single-line)
#   $1010-$2A4F  the field: mode E 160x168 (line 102 at $2000, the 4K
#                boundary); a text screen (24 x 40) in the same memory
#   $2A50-$2AC7  the field's status rows, 3 x 40
#   $2B00-$30FF  the compiled DLIs, two buffers
#   $3100-$3FFF  RAM: the variables, then the C stack
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0040;   # (25 bytes used at most: barrage.cfg)
    __REPL__:      type = weak, value = $5A00;
}
MEMORY {
    ZP:      file = "", start = $001D, size = $00E3, type = rw, define = yes;
    LOW:     file = "", start = $021C, size = $0800 - $021C, type = rw, define = yes;
    PMGFREE: file = "", start = $0800, size = $0300, type = rw;
    RAM:     file = "", start = $3100, size = $4000 - $3100 - __STACKSIZE__, type = rw, define = yes;
    STACK:   file = "", start = $4000 - __STACKSIZE__, size = __STACKSIZE__, type = rw, define = yes;

    O1:  file = %O, start = $4000, size = __REPL__ - $4000, fill = yes, fillval = $FF, define = yes;
    RL1: file = %O, start = __REPL__, size = $B000 - __REPL__, fill = yes, fillval = $FF;
    AR1: file = %O, start = $B000, size = $0800, fill = yes, fillval = $FF;
    RH1: file = %O, start = $B800, size = $07C0, fill = yes, fillval = $FF;
    HT1: file = %O, start = $BFC0, size = $0040, fill = yes, fillval = $FF;
    O2:  file = %O, start = $4000, size = __REPL__ - $4000, fill = yes, fillval = $FF, define = yes;
    RL2: file = %O, start = __REPL__, size = $B000 - __REPL__, fill = yes, fillval = $FF;
    AR2: file = %O, start = $B000, size = $0800, fill = yes, fillval = $FF;
    RH2: file = %O, start = $B800, size = $07C0, fill = yes, fillval = $FF;
    HT2: file = %O, start = $BFC0, size = $0040, fill = yes, fillval = $FF;
    O3:  file = %O, start = $4000, size = __REPL__ - $4000, fill = yes, fillval = $FF, define = yes;
    RL3: file = %O, start = __REPL__, size = $B000 - __REPL__, fill = yes, fillval = $FF, define = yes;
    AR3: file = %O, start = $B000, size = $0800, fill = yes, fillval = $FF;
    RH3: file = %O, start = $B800, size = $07BC, fill = yes, fillval = $FF, define = yes;
    GD3: file = %O, start = $BFBC, size = $0004, fill = yes, fillval = $FF;
    HS3: file = %O, start = $BFC0, size = $0020, fill = yes, fillval = $FF;
    CL3: file = %O, start = $BFE0, size = $0008, fill = yes, fillval = $00;
    HD3: file = %O, start = $BFE8, size = $0018;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,  type = zp;
    EXTZP:     load = ZP,  type = zp, optional = yes;
    # bank 1's own: the boot code, the test scenes
    BOOTCODE:  load = O1,  type = ro, define = yes, optional = yes;
    BOOTRO:    load = O1,  type = ro, define = yes, optional = yes;
    # bank 2's own: the rooms, the catalog
    ROOMCODE:  load = O2,  type = ro, define = yes;
    ROOMRO:    load = O2,  type = ro, define = yes, optional = yes;
    CATALOG:   load = O2,  type = ro, define = yes;
    # bank 3's own: the field
    FIELDCODE: load = O3,  type = ro, define = yes;
    FIELDRO:   load = O3,  type = ro, define = yes, optional = yes;
    # the core
    STARTUP:   load = RL3, type = ro, define = yes;
    LOWCODE:   load = RL3, type = ro, optional = yes;
    ONCE:      load = RL3, type = ro, optional = yes;
    CODE:      load = RL3, type = ro, define = yes;
    CASCODE:   load = RL3, type = ro, optional = yes;
    RODATA:    load = RL3, type = ro, define = yes;
    DATA:      load = RH3, run = RAM, type = rw, define = yes;
    HICODE:    load = RH3, type = ro, optional = yes;
    BSS:       load = RAM, type = bss, define = yes;
    HIGH:      load = RAM, type = bss, optional = yes;
    MIDBSS:    load = LOW, type = bss, optional = yes;
    LOWBSS:    load = LOW, type = bss, optional = yes;
    BSS2:      load = LOW, type = bss, optional = yes;
    INIT:      load = RAM, type = bss, optional = yes;
    PMGFREE:   load = PMGFREE, type = bss, optional = yes;
    CLAIM:     load = CL3, type = ro;
    CARTHDR:   load = HD3, type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
