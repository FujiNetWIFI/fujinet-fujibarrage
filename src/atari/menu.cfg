# menu.cfg -- MENU.COM (the title, the name, the rooms): barrage.cfg without the boot code.
# GENERATED from barrage.cfg by the Makefile.
#
#   $0400-$047F  CAS: code, in the cassette buffer (the OS reads the boot
#                sector there, then never touches it again: no cassette)
#   $0480-$06FF  LOWBSS: variables (not loaded)
#   $0700-$09FF  picoboot and its sector buffer while loading, then BSS2
#   $0A00-       the program, then the C stack (128 bytes) under $9000
#   $9000-$95FF  DLICODE: the field's display interrupts, compiled (dlc.c),
#                two 768-byte buffers (one shown, one being built)
#   $9600-$97FF  MID: the netstream ring, the blasts and settles
#   $9800-$9AFF  PMGFREE (PMBASE's unused part): display lists, the
#                netstream frame, the text screen's row tables
#   $9B00-$9FFF  missiles, players 0-3 (single-line)
#   $A010-$BA4F  the field: ANTIC mode E, 160x168, 40 bytes a line (line 102
#                starts at $B000, the 4K boundary, so the lines are contiguous).
#                At start-up the BOOT code loads at $A400 (past the text
#                screen): what runs once (the appkeys, the title, the name);
#                field_init clears it all after.
#   $BA50-$BFFF  HIGH: the status rows (3x40), the tracks, the DLI compiler's
#                tables, the room list, the catalog's index
#   (a text screen, 24x40, is drawn in the field's memory: it only shows
#   between rounds, and the field is sent whole after one)
#
# The INIT chunk (src/atari/start.s) runs first: it switches BASIC off on an
# XL/XE, checks for 48K and blanks the screen while the rest loads.
FEATURES {
    STARTADDRESS: default = $0A00;
}
SYMBOLS {
    __STACKSIZE__:       type = weak, value = $0080;   # 25 bytes used at most (static locals)
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = weak, value = $0000;
    __GFX_START__:       type = export, value = $9000;
    __SYSCHKHDR__:       type = export, value = 0;
    __SYSCHKTRL__:       type = export, value = 0;
}
MEMORY {
    ZP:      file = "", define = yes, start = $0082, size = $007E;
    CAS:     file = %O,               start = $0400, size = $0080;
    LOW:     file = "", define = yes, start = $0480, size = $0280;
    LOW2:    file = "", define = yes, start = $0700, size = $0300;
    START:   file = %O,               start = $2E00, size = $0100;
    MAIN:    file = %O, define = yes, start = %S,    size = __GFX_START__ - __STACKSIZE__ - %S;
    DLICODE: file = "",               start = $9000, size = $0600;
    MID:     file = "",               start = $9600, size = $0200;
    PMGFREE: file = "",               start = $9800, size = $0300;
    HIGH:    file = "",               start = $BAC8, size = $0538;
}
FILES {
    %O: format = atari;
}
FORMATS {
    atari: runad = start,
           initad = START: fb_start;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    EXTZP:    load = ZP,      type = zp,               optional = yes;
    CASCODE:  load = CAS,     type = ro,               optional = yes;
    LOWBSS:   load = LOW,     type = bss,              optional = yes;
    BSS2:     load = LOW2,    type = bss,              optional = yes;
    FBSTART:  load = START,   type = ro;
    STARTUP:  load = MAIN,    type = ro,  define = yes;
    LOWCODE:  load = MAIN,    type = ro,  define = yes, optional = yes;
    ONCE:     load = MAIN,    type = ro,               optional = yes;
    CODE:     load = MAIN,    type = ro,  define = yes;
    RODATA:   load = MAIN,    type = ro;
    DATA:     load = MAIN,    type = rw;
    INIT:     load = MAIN,    type = bss, define = yes, optional = yes;
    BSS:      load = MAIN,    type = bss, define = yes;
    DLICODE:  load = DLICODE, type = bss,              optional = yes;
    MIDBSS:   load = MID,     type = bss,              optional = yes;
    PMGFREE:  load = PMGFREE, type = bss;
    HIGH:     load = HIGH,    type = bss,              optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
