# FujiBarrage (Apple II, 128K //e, //c, IIgs): a ProDOS program around HGR
# page 1, the field.
#
# Main RAM:
#   $0400-$07FF  text page 1: the text screens, and the field's HUD rows
#   $0803-$1FFF  start-up, low code, data, the shared code's Atari-named
#                corners (BOOTCODE, MIDBSS, BSS2, HIGH, PMGFREE: zeros in
#                the file, so loading clears them)
#   $2000-$3FFF  HGR page 1, the field (zeros in the file: the loader skips
#                them, tools/a2loader)
#   $4000-$BDFF  code, read-only data, BSS (page 2 is free: the text
#                screens are text mode)
#   $BE00-$BEFF  the C stack
#   $D400-$DFFF  the language card's bank 2, behind ProDOS's quit code: the
#                field's code and tables (fld.s), input.c

FEATURES {
    STARTADDRESS: default = $0803;
}
SYMBOLS {
    __EXEHDR__:    type = import;
    __FILETYPE__:  type = weak, value = $0006; # ProDOS file type
    __STACKSIZE__: type = weak, value = $0100; # C stack, $BE00-$BEFF
    __HIMEM__:     type = weak, value = $BF00; # below the ProDOS global page
    __LCADDR__:    type = weak, value = $D400; # behind quit code
    __LCSIZE__:    type = weak, value = $0C00; # rest of bank two
}
MEMORY {
    ZP:     file = "", define = yes, start = $0080,        size = $0070;
    HEADER: file = %O,               start = %S - $003A,   size = $003A;
    MAIN:   file = %O, define = yes, start = %S,           size = __HIMEM__ - __STACKSIZE__ - %S;
    BSS:    file = "",               start = __ONCE_RUN__, size = __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__;
    LC:     file = "", define = yes, start = __LCADDR__,   size = __LCSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    EXEHDR:   load = HEADER,         type = ro,  optional = yes;
    STARTUP:  load = MAIN,           type = ro;
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;
    LOWDATA:  load = MAIN,           type = ro,  optional = yes;
    BOOTCODE: load = MAIN,           type = ro,  optional = yes;    # (appkey.c)
    MIDBSS:   load = MAIN,           type = rw,  define = yes, optional = yes;
    BSS2:     load = MAIN,           type = rw,  define = yes, optional = yes;
    HIGH:     load = MAIN,           type = rw,  define = yes, optional = yes;
    PMGFREE:  load = MAIN,           type = rw,  define = yes, optional = yes;
    HGRPAGE:  load = MAIN,           type = rw,  start = $2000;     # 8K, src/apple2/pages.s
    CODE:     load = MAIN,           type = ro,  start = $4000;
    RODATA:   load = MAIN,           type = ro;
    ONCE:     load = MAIN,           type = ro,  define = yes;
    LC:       load = MAIN, run = LC, type = rw,  optional = yes;
    BSS:      load = BSS,            type = bss, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
